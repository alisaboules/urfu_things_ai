name: Deploy to Render

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Это разрешение необходимо для получения OIDC-токена

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Шаг для аутентификации в Google Cloud с использованием Workload Identity Federation
    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        token_format: 'access_token'
        workload_identity_provider: ${{ secrets.WIF_PROVIDER_ID }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

    # Шаг для деплоя на Render
    - name: Deploy to Render
      run: |
        curl -X POST https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_API_KEY }}